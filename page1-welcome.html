<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome — Dealism</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f0f0f5;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .phone {
    width: 375px;
    height: 812px;
    background: #fff;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 0 0 2px #d1d1d6;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .notch {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
  }
  .statusbar {
    height: 54px; background: #fff;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 8px; font-size: 14px; font-weight: 600; color: #1a1a1a;
  }
  .statusbar .time { font-size: 15px; font-weight: 700; }
  .statusbar .icons { display: flex; gap: 5px; font-size: 12px; color: #666; }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 36px 40px;
    text-align: center;
  }

  .logo {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #7c5bf0 0%, #5b8af0 100%);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 40px;
    box-shadow: 0 8px 32px rgba(124, 91, 240, 0.3);
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.35;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 16px;
    color: #888;
    line-height: 1.6;
    margin-bottom: 60px;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #7c5bf0 0%, #5b8af0 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(124, 91, 240, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration: none;
    display: block;
    text-align: center;
  }
  .start-btn:active {
    transform: scale(0.97);
  }

  .footer-note {
    margin-top: 24px;
    font-size: 13px;
    color: #bbb;
  }

  .home-bar {
    height: 34px; display: flex; align-items: center; justify-content: center;
  }
  .home-bar .bar { width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; }

  .back-link {
    position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #fff;
    text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 100;
  }
</style>
</head>
<body>
<a href="index.html" class="back-link">← All Pages</a>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons">📶 WiFi 🔋</div>
  </div>

  <div class="content">
    <div class="logo">✨</div>
    <h1 class="title">你的私人助手<br>已经准备好了</h1>
    <p class="subtitle">我会替你处理琐事、追踪进展、<br>记住你在意的一切。</p>
    <a href="page2-onboarding-chat.html" class="start-btn">开始</a>
    <p class="footer-note">只需 2 分钟</p>
  </div>

  <div class="home-bar"><div class="bar"></div></div>
</div>
</body>
</html>
